
<style>

</style>

<p class="hint">Tap any screen to see what happens inside it</p>

function showDetail(key) {
  const d = details[key];
  if (!d) return;
  const panel = document.getElementById('detail');
  document.getElementById('d-title').textContent = d.title;
  document.getElementById('d-tags').innerHTML = d.tags.map(([t, c]) =>
    `<span class="tag tag-${c}">${t}</span>`
  ).join('');
  document.getElementById('d-list').innerHTML = d.items.map(i => `<li>${i}</li>`).join('');
  panel.classList.add('active');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
