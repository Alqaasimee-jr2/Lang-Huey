name: jss1_french
description: Junior Secondary School 1 (JSS1) French Language Offline Smartboard Classroom Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  just_audio: ^0.9.36
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/jss1_term1/
    - assets/images/jss1_term2/
    - assets/images/jss1_term3/
    - assets/audio/
    - assets/audio/onboarding/
    - assets/audio/jss1_term1/
    - assets/audio/jss1_term2/
    - assets/audio/jss1_term3/
