<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon: the smartboard, teaching on its own -->
  <rect x="20" y="20" width="180" height="180" rx="42" fill="#0D7377"/>
  <rect x="32" y="32" width="156" height="156" rx="32" fill="none" stroke="#14BDCC" stroke-width="3" opacity="0.8"/>

  <!-- eyes -->
  <circle cx="80" cy="92" r="13" fill="#14BDCC"/>
  <circle cx="140" cy="92" r="13" fill="#14BDCC"/>

  <!-- smile / soundwave mouth — single gold focal point -->
  <path d="M 72 148 Q 110 190 148 148" fill="none" stroke="#F4A832" stroke-width="11" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="230" y="112" font-family="'Poppins','Segoe UI',sans-serif" font-weight="800" font-size="68" letter-spacing="-1.5">
    <tspan fill="#1C1C1C">Lang </tspan><tspan fill="#0D7377">Huey</tspan>
  </text>
