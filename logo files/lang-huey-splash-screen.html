<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 38%, #0F8489 0%, #0D7377 55%, #0A5A5D 100%);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
  }

  .screen {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* floating background shapes, duolingo-style ambient depth */
  .float {
    position: absolute;
    border-radius: 50%;
    background: #14BDCC;
    opacity: 0.14;
    animation: drift 7s ease-in-out infinite;
  }
  .float.f1 { width: 90px;  height: 90px;  top: 12%; left: 10%; animation-duration: 8s; }
  .float.f2 { width: 50px;  height: 50px;  top: 70%; left: 16%; animation-duration: 6s; }
  .float.f3 { width: 70px;  height: 70px;  top: 20%; left: 84%; animation-duration: 9s; }
  .float.f4 { width: 40px;  height: 40px;  top: 76%; left: 80%; animation-duration: 7s; }
  .float.f5 { width: 30px;  height: 30px;  top: 45%; left: 6%;  animation-duration: 5.5s; }
  .float.f6 { width: 26px;  height: 26px;  top: 50%; left: 92%; animation-duration: 6.5s; }
  @keyframes drift {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-26px) scale(1.08); }
  }

  /* mascot entrance */
  .mascot-wrap {
    width: 26vh;
    height: 26vh;
    animation: pop-in 0.9s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pop-in {
    0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
    60%  { transform: scale(1.12) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .buddy {
    width: 100%;
    height: 100%;
    animation: bob 2.4s ease-in-out infinite;
    animation-delay: 0.9s;
    transform-origin: center bottom;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-3.2%) rotate(-1.5deg); }
  }

  .antenna-group {
    animation: sway 2.4s ease-in-out infinite;
    animation-delay: 0.9s;
    transform-origin: 110px 40px;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }

  .star {
    animation: twinkle 1.2s ease-in-out infinite;
    animation-delay: 0.9s;
    transform-origin: 110px 20px;
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.25); opacity: 0.7; }
  }

  .eye {
    animation: blink 3.6s ease-in-out infinite;
    animation-delay: 0.9s;
    transform-origin: center;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.1); }
  }

  .mouth {
    animation: talk 1.6s ease-in-out infinite;
    animation-delay: 0.9s;
    transform-origin: 110px 148px;
  }
  @keyframes talk {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.4); }
  }

  .cheek {
    animation: pulse 2.4s ease-in-out infinite;
    animation-delay: 0.9s;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.9; }
  }

  /* logotype */
  .logotype {
    margin-top: 3.2vh;
    font-size: 6.4vh;
    font-weight: 800;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: text-pop 0.7s cubic-bezier(.34,1.56,.64,1) both;
    animation-delay: 0.65s;
  }
  @keyframes text-pop {
    0%   { transform: translateY(16px) scale(0.85); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .logotype .lang { color: #F5F0E8; }
  .logotype .huey { color: #F4A832; }

  /* loading dots */
  .loading {
    margin-top: 4vh;
    display: flex;
    gap: 1.4vh;
    opacity: 0;
    animation: fade-in 0.6s ease forwards;
    animation-delay: 1.5s;
  }
  @keyframes fade-in { to { opacity: 1; } }

  .dot {
    width: 1.6vh;
    height: 1.6vh;
    border-radius: 50%;
    background: #14BDCC;
    animation: dot-bounce 1.1s ease-in-out infinite;
  }
  .dot:nth-child(1) { animation-delay: 0s; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40%           { transform: translateY(-1vh); opacity: 1; }
  }
</style>
</head>
<body>
<div class="screen">

  <div class="float f1"></div>
  <div class="float f2"></div>
  <div class="float f3"></div>
  <div class="float f4"></div>
  <div class="float f5"></div>
  <div class="float f6"></div>

  <div class="mascot-wrap">
    <svg class="buddy" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <g class="antenna-group">
        <line x1="110" y1="40" x2="110" y2="18" stroke="#083f42" stroke-width="6" stroke-linecap="round"/>
        <path class="star" d="M 110 6 l 4.5 9 l 10 1.4 l -7.2 6.8 l 1.7 9.8 l -9 -4.7 l -9 4.7 l 1.7 -9.8 l -7.2 -6.8 l 10 -1.4 z" fill="#F4A832"/>
      </g>
      <rect x="20" y="40" width="180" height="160" rx="55" fill="#F5F0E8"/>
      <rect x="32" y="52" width="156" height="136" rx="45" fill="none" stroke="#14BDCC" stroke-width="4" opacity="0.85"/>
      <circle class="cheek" cx="62" cy="130" r="14" fill="#F4A832" opacity="0.6"/>
      <circle class="cheek" cx="158" cy="130" r="14" fill="#F4A832" opacity="0.6"/>
      <circle cx="80" cy="105" r="22" fill="#0D7377"/>
      <circle cx="140" cy="105" r="22" fill="#0D7377"/>
      <circle class="eye" cx="83" cy="107" r="10" fill="#1C1C1C"/>
      <circle class="eye" cx="143" cy="107" r="10" fill="#1C1C1C"/>
      <circle cx="87" cy="102" r="3" fill="#F5F0E8"/>
      <circle cx="147" cy="102" r="3" fill="#F5F0E8"/>
      <path class="mouth" d="M 82 146 Q 110 168 138 146 Q 110 156 82 146 Z" fill="#F4A832"/>
    </svg>
  </div>

  <div class="logotype"><span class="lang">Lang </span><span class="huey">Huey</span></div>

  <div class="loading">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</div>
</body>
</html>
