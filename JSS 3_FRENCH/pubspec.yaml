name: jss3_french
description: "Lang Huey - JSS 3 French Offline Smartboard Interactive Classroom Engine"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  google_fonts: ^6.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/audio/jss3_term1/
    - assets/audio/jss3_term2/
    - assets/images/
    - assets/images/jss3_term1/
    - assets/images/jss3_term2/
